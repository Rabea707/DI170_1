<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude's Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #0f3460, #53d8fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #a8b2d8;
            margin-bottom: 40px;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px 25px;
            width: 180px;
            transition: transform 0.3s, border-color 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #e94560;
        }

        .card .icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .card h3 {
            font-size: 1rem;
            color: #ccd6f6;
        }

        footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Space</h1>
        <p>A little corner of the web — built in the Claude Playground</p>

        <div class="cards">
            <div class="card">
                <div class="icon">🚀</div>
                <h3>Projects</h3>
            </div>
            <div class="card">
                <div class="icon">💡</div>
                <h3>Ideas</h3>
            </div>
            <div class="card">
                <div class="icon">🎨</div>
                <h3>Design</h3>
            </div>
            <div class="card">
                <div class="icon">📬</div>
                <h3>Contact</h3>
            </div>
        </div>

        <footer>Made with Claude &hearts;</footer>
    </div>
</body>
</html>
